<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#028aa7">

<title>大连市友谊医院 - 院内药品信息数智通</title>
<meta name="apple-mobile-web-app-title" content="友谊药智通">
<meta name="application-name" content="友谊药智通">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --primary-color: #028aa7;
    --primary-light: #e6f4f7;
    --accent-color: #ff9800;
    --text-dark: #222222; 
    --text-muted: #555555; 
    --bg-light: #f0f4f7;
    --card-bg: #ffffff;
    --border-color: #e1e6eb;
    --success-color: #2e7d32;
    --success-light: #e8f5e9;
    --danger-color: #c62828;
    --danger-light: #ffebee;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: var(--bg-light); color: var(--text-dark); }

  header {
    background: linear-gradient(135deg, var(--primary-color), #016b82);
    color: white;
    padding: 20px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  header h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { font-size: 0.8rem; opacity: 0.85; margin-top: 5px; }

  .pwa-install-banner {
    background-color: var(--accent-color);
    color: white;
    padding: 12px 16px;
    display: none;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .pwa-btn {
    background: white;
    color: var(--accent-color);
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }

  .container { max-width: 640px; margin: 0 auto; padding: 18px 14px; }

  /* 搜索区 */
  .search-box {
    background: var(--card-bg);
    padding: 20px 18px;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  .search-label {
    font-size: 0.95rem; 
    color: var(--text-dark);
    margin-bottom: 10px;
    font-weight: bold;
  }
  .search-wrapper {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .search-input {
    flex: 1;
    padding: 13px 16px;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    font-size: 1.1rem; 
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg-light);
  }
  .search-input:focus { border-color: var(--primary-color); background: white; }
  .search-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .search-btn {
    padding: 13px 24px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem; 
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 3px 8px rgba(2, 138, 167, 0.3);
  }
  .search-btn:active { transform: scale(0.97); }
  .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .search-hint {
    font-size: 0.85rem;
    color: #666;
    margin-top: 9px;
    padding-left: 2px;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.05rem; 
    font-weight: bold;
    color: var(--primary-color);
    padding: 0 4px 14px 4px;
    min-height: 30px;
  }
  .sync-btn {
    background: #e6f4f7;
    border: 1px solid var(--primary-color);
    color: var(--primary-color);
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95rem; 
    padding: 6px 14px;
    border-radius: 6px;
    margin-left: auto; 
  }

  /* 空态提示 */
  .welcome-box {
    text-align: center;
    padding: 52px 20px;
    color: var(--text-muted);
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .welcome-icon { font-size: 3.5rem; margin-bottom: 14px; }
  .welcome-title { font-size: 1.2rem; color: #333; font-weight: 600; margin-bottom: 8px; }
  .welcome-sub { font-size: 0.95rem; color: #777; }

  /* 卡片列表 */
  .result-list { display: flex; flex-direction: column; gap: 14px; }

  .item-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 20px 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    border-left: 6px solid var(--primary-color);
    transition: box-shadow 0.2s;
  }
  .item-card:active { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }
  .item-title {
    font-size: 1.35rem; 
    font-weight: 800;
    color: #000000;
    flex: 1;
    line-height: 1.4;
  }

  /* 商品名与库存状态同行包裹器 */
  .brand-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
    min-height: 32px;
  }

  .brand-tag {
    display: inline-block;
    font-size: 1.0rem; 
    padding: 4px 10px;
    border-radius: 5px;
    background-color: #fff3e0;
    color: #d84315;
    font-weight: bold;
    margin-bottom: 0; 
  }

  .badge-stock {
    padding: 4px 14px; 
    border-radius: 6px;
    font-size: 1.1rem; 
    font-weight: bold;
    letter-spacing: 0.04em;
    white-space: nowrap;
    margin-left: auto; 
  }
  .badge-stock.has { background-color: var(--success-color); color: white; } 
  .badge-stock.empty { background-color: var(--danger-color); color: white; } 

  .item-divider {
    border: none;
    border-top: 1.5px solid var(--border-color);
    margin: 12px 0;
  }

  .item-row {
    font-size: 1.15rem; 
    color: var(--text-dark);
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    line-height: 1.6; 
  }
  .item-label {
    min-width: 95px; 
    color: #666666; 
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .item-value { color: #111111; flex: 1; font-weight: 500; }
  .item-value.highlight {
    color: var(--primary-color);
    font-weight: bold;
    font-size: 1.25rem; 
  }
  .item-value.price {
    color: #d32f2f;
    font-weight: bold;
    font-size: 1.3rem; 
  }

  .loading-box, .empty-box {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border-color);
    border-top-color: var(--primary-color);
    border-radius: 50%;
    margin: 0 auto 14px auto;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="pwa-install-banner" id="pwaBanner">
  <span>💡 监测到支持安装，可在电脑桌面独立运行</span>
  <button class="pwa-btn" id="pwaBtn">添加到桌面</button>
</div>

<header>
  <h1>大连市友谊医院 - 院内药品信息数智通</h1>
  <div class="sub">适配 GitHub / 医院内网双环境实时系统</div>
</header>

<div class="container">
  <div class="search-box">
    <div class="search-label">药品检索（支持名称 / 商品名查询）</div>
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input"
             placeholder="请输入药品名称或商品名..."
             disabled
             autocomplete="off"
             inputmode="search">
      <button id="searchBtn" class="search-btn" onclick="doSearch()" disabled>查询</button>
    </div>
    <div class="search-hint" id="searchHint">正在同步药库数据，请稍候…</div>
  </div>

  <div class="status-bar">
    <span id="totalCount"></span>
    <button class="sync-btn" onclick="loadExcelData()">🔄 刷新数据</button>
  </div>

  <div id="resultList" class="result-list">
    <div class="loading-box"><div class="spinner"></div><p>正在拉取最新药品库存报表…</p></div>
  </div>
</div>

<script>
  const EXCEL_FILE_NAME = 'stock.xlsx';
  let inventoryData = [];
  let deferredPrompt = null;
  let dataReady = false;

  // 1. 数据异步同步与清洗
  async function loadExcelData() {
    const listContainer = document.getElementById('resultList');
    listContainer.innerHTML = `<div class="loading-box"><div class="spinner"></div><p style="font-size:1.1rem;">正在建立数据通道…</p></div>`;
    dataReady = false;
    document.getElementById('searchInput').disabled = true;
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('searchHint').textContent = '正在同步药库数据，请稍候…';
    document.getElementById('totalCount').textContent = ''; 

    try {
      const response = await fetch(`./${EXCEL_FILE_NAME}?t=${Date.now()}`);
      if (!response.ok) throw new Error('文件未找到');

      const arrayBuffer = await response.arrayBuffer();
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });
      const worksheet = workbook.Sheets[workbook.SheetNames[0]];
      const rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

      let headerIndex = 0;
      for (let i = 0; i < rawJson.length; i++) {
        if (rawJson[i] && (rawJson[i].includes('名称') || rawJson[i].includes('编码'))) {
          headerIndex = i;
          break;
        }
      }

      const headers = rawJson[headerIndex];
      inventoryData = [];

      const idxRoom     = headers.indexOf('库房');
      const idxLocation = headers.indexOf('库房货位');
      const idxName     = headers.indexOf('名称');
      const idxBrand    = headers.indexOf('商品名');
      const idxSpec     = headers.indexOf('规格');
      const idxFactory  = headers.indexOf('产地');
      const idxPrice    = headers.indexOf('价格');
      const idxQty      = headers.indexOf('数量');

      for (let j = headerIndex + 1; j < rawJson.length; j++) {
        const row = rawJson[j];
        if (!row || row.length === 0 || !row[idxName]) continue;
        inventoryData.push({
          room:      row[idxRoom]     || '',
          name:      row[idxName]     || '',
          brandName: row[idxBrand]    || '',
          spec:      row[idxSpec]     || '',
          factory:   row[idxFactory]  || '',
          price:     row[idxPrice]    != null ? row[idxPrice] : null,
          quantity:  parseInt(row[idxQty]) || 0
        });
      }

      dataReady = true;
      document.getElementById('searchInput').disabled = false;
      document.getElementById('searchBtn').disabled = false;
      
      document.getElementById('searchHint').textContent = `数据已同步成功，输入关键词后点击查询`;
      document.getElementById('totalCount').textContent = ``; 

      listContainer.innerHTML = `
        <div class="welcome-box">
          <div class="welcome-icon">💊</div>
          <div class="welcome-title">数据已就绪</div>
          <div class="welcome-sub">请在上方输入药品名称或商品名进行查询</div>
        </div>`;

      // 清除历史监听，防止重复绑定
      const oldInput = document.getElementById('searchInput');
      const newInput = oldInput.cloneNode(true);
      oldInput.parentNode.replaceChild(newInput, oldInput);
      
      newInput.disabled = false;
      newInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doSearch();
      });

    } catch (error) {
      console.error(error);
      listContainer.innerHTML = `
        <div class="empty-box" style="color: var(--danger-color);">
          <p style="font-size:1.2rem; font-weight:bold;">❌ 数据读取错误</p>
          <p style="font-size:1.0rem; margin-top:10px; color:#333;">
            请确认 <b>${EXCEL_FILE_NAME}</b> 与本页面位于同一目录，且文件未被损坏或锁定。
          </p>
        </div>`;
      document.getElementById('searchHint').textContent = '数据加载失败，请点击右侧"刷新数据"重试';
    }
  }

  // 2. 执行查询
  function doSearch() {
    if (!dataReady) return;
    const val = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!val) {
      document.getElementById('resultList').innerHTML = `
        <div class="welcome-box">
          <div class="welcome-icon">🔍</div>
          <div class="welcome-title">请输入查询关键词</div>
          <div class="welcome-sub">支持药品名称 / 商品名模糊检索</div>
        </div>`;
      document.getElementById('totalCount').textContent = ``; 
      return;
    }
    const res = inventoryData.filter(i =>
      i.name.toLowerCase().includes(val) ||
      i.brandName.toLowerCase().includes(val)
    );
    document.getElementById('totalCount').textContent = `查询到 ${res.length} 条匹配记录`;
    renderList(res);
  }

  // 3. 高还原度卡片视图渲染
  function renderList(data) {
    const listContainer = document.getElementById('resultList');
    if (!data || data.length === 0) {
      listContainer.innerHTML = `
        <div class="empty-box">
          <div style="font-size:3rem;margin-bottom:12px;">📭</div>
          <div style="font-weight:bold;color:#222;font-size:1.2rem;margin-bottom:6px;">未查询到匹配药品</div>
          <div style="font-size:1.0rem;color:#666;">请尝试其他名称或商品名</div>
        </div>`;
      return;
    }

    listContainer.innerHTML = data.map(item => {
      const hasStock = item.quantity > 0;
      const stockLabel = hasStock ? '有' : '无';
      const stockClass = hasStock ? 'has' : 'empty';
      const priceText  = (item.price != null && item.price !== '') ? `¥ ${Number(item.price).toFixed(2)}` : '-';

      return `
        <div class="item-card">
          <div class="item-header">
            <div class="item-title">${item.name || '-'}</div>
          </div>
          
          <div class="brand-status-row">
            ${item.brandName ? `<div><span class="brand-tag">商品名：${item.brandName}</span></div>` : '<div></div>'}
            <div class="badge-stock ${stockClass}">${stockLabel}</div>
          </div>

          <hr class="item-divider">
          <div class="item-row">
            <span class="item-label">规  格：</span>
            <span class="item-value">${item.spec || '-'}</span>
          </div>
          <div class="item-row">
            <span class="item-label">生产商：</span>
            <span class="item-value">${item.factory || '-'}</span>
          </div>
          <div class="item-row">
            <span class="item-label">价  格：</span>
            <span class="item-value price">${priceText}</span>
          </div>
          <div class="item-row">
            <span class="item-label">所在药房：</span>
            <span class="item-value highlight">${item.room || '-'}</span>
          </div>
        </div>`;
    }).join('');
  }

  // 4. PWA 安装与缓存控制逻辑
  function setupPWA() {
    const manifest = {
      "short_name": "友谊药信通",
      "name": "大连市友谊医院院内药品信息数智通",
      "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/3022/3022226.png", "type": "image/png", "sizes": "512x512" }],
      "start_url": "./index.html",
      "background_color": "#f0f4f7",
      "theme-color": "#028aa7",
      "display": "standalone"
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaBanner').style.display = 'flex';
    });

    document.getElementById('pwaBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') document.getElementById('pwaBanner').style.display = 'none';
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      // 升级为 yy-v5 缓存库名称，且只缓存第三方外部资源，绝不拦截本地 index.html 网页
      const swCode = `
        const CACHE_NAME = 'yy-v5';
        self.addEventListener('install', e => { 
          e.waitUntil(
            caches.open(CACHE_NAME).then(c => c.addAll(['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']))
          ); 
        });
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE_NAME ? caches.delete(k) : null)))
          );
        });
        self.addEventListener('fetch', e => {
          if (e.request.url.includes('xlsx') || e.request.url.includes('jsdelivr')) {
            e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
          } else {
            e.respondWith(fetch(e.request));
          }
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
    }
  }

  window.addEventListener('DOMContentLoaded', () => { setupPWA(); loadExcelData(); });
</script>
</body>
</html>
